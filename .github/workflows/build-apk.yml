name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Chế độ build (release hoặc debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-android:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cài đặt Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Cài đặt thư viện (npm install)
        run: npm install

      - name: Tạo asset backgrounds
        run: node scripts/generateBackgrounds.js

      - name: Cấp quyền chạy cho gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            echo "Building Debug APK..."
            ./gradlew assembleDebug --no-daemon
          else
            echo "Building Release APK..."
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Tải file APK lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LiquidMoney-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14
